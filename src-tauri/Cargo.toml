[package]
name = "moji-desktop"
version = "0.1.0"
description = "墨集文档管理系统桌面端"
edition = "2024"
rust-version = "1.97.1"

[lib]
name = "moji_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
base64 = "=0.22.1"
file-id = "=0.2.3"
image = "=0.25.9"
notify = "=8.2.0"
lopdf = "=0.38.0"
ppocr-rs = { version = "=0.7.3", features = ["example-dynamic"] }
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"
tauri = { version = "=2.11.5", features = [] }
tracing = "=0.1.44"
tracing-subscriber = "=0.3.23"
