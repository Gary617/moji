[package]
name = "moji-desktop"
version = "0.1.0"
description = "墨集文档管理系统桌面端"
edition = "2024"
rust-version = "1.97.1"

[lib]
name = "moji_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tauri = { version = "=2.11.5", features = [] }
tracing = "=0.1.44"
tracing-subscriber = "=0.3.23"
