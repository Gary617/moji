[package]
name = "moji-desktop"
version = "0.1.0"
description = "墨集文档管理系统桌面端"
edition = "2024"
rust-version = "1.97.1"

[lib]
name = "moji_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
windows = { version = "=0.61.3", features = ["Media_Control"] }
base64 = "=0.22.1"
file-id = "=0.2.3"
image = "=0.25.9"
notify = "=8.2.0"
lopdf = "=0.38.0"
quick-xml = "=0.41.0"
ppocr-rs = { version = "=0.7.3", features = ["example-dynamic"] }
reqwest = { version = "=0.13.4", default-features = false, features = ["blocking", "json", "rustls-no-provider"] }
rustls = { version = "=0.23.43", default-features = false, features = ["std", "ring", "tls12"] }
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"
tauri = { version = "=2.11.5", features = [] }
tauri-plugin-dialog = "=2.7.2"
tracing = "=0.1.44"
tracing-subscriber = "=0.3.23"
windows-sys = { version = "=0.61.2", features = ["Win32_Security_Credentials", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_Foundation", "Win32_System_Threading"] }
getrandom = "=0.3.4"
zip = { version = "=6.0.0", default-features = false, features = ["deflate"] }
